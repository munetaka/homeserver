name: test

on:
  push:
    branches: [main]
  pull_request:

# リポジトリ既定も Read だが、ワークフロー単体でも最小権限を明示しておく
permissions:
  contents: read

jobs:
  # ジョブ名 "test" は下の dependabot-merge が needs で参照している
  test:
    runs-on: ubuntu-latest
    steps:
      # actions はタグ書き換え対策でコミットハッシュ固定。Dependabot がハッシュごと更新する
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Run tests with coverage
        run: uv run pytest --cov
      - name: Coverage summary
        # カバレッジ不足 (fail_under) でテストが落ちたときこそ内訳を見たいので always。
        # --fail-under=0 は summary 出力ステップ自体が二重に失敗しないようにするため
        if: always()
        run: |
          if [ -f .coverage ]; then
            echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
            uv run coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Lint deploy scripts
        run: shellcheck deploy/bin/*.sh scripts/*.sh
      - name: Test healthz monitor Worker
        # 依存パッケージなし (Node 標準の node:test)。ランナー同梱の Node で動く
        working-directory: deploy/cloudflare/healthz-monitor
        run: node --test

  # Dependabot の PR を、test が成功した後にだけマージする。
  # 以前は別ワークフローで auto-merge を予約していたが、main のルールセットに必須チェックが
  # 登録されていなかったため test の完了を待たずにマージされていた
  # (docs/incidents/2026-11-13-dependabot-merged-before-test.md)。
  # needs: test にすれば、ルールセットの設定に依存せず「test 成功 → マージ」の順序が保証される
  # (if に status 関数が無いので暗黙の success() が付き、test が失敗・中断したらスキップされる)
  dependabot-merge:
    needs: test
    # github.actor は人が再実行すると変わるため、PR の作成者で判定する
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      # 自動マージしないもの (= 手動で確認してマージ):
      #   - メジャー更新 (破壊的変更の可能性。リリースノートを読む)
      #   - bleak / dbus-fast (BLE・D-Bus の挙動は CI では検証できない。Pi 実機で確認する)
      # 例外: certifi 単独の PR はメジャーでも自動マージする。日付バージョン (2025.x→2026.x) で
      # 年が変わるたびにメジャー扱いになるが、中身は CA 証明書リスト (データ) だけで、
      # 危殆化した CA の除去など急ぎのセキュリティ更新が多いため
      - if: >-
          (steps.meta.outputs.update-type != 'version-update:semver-major'
           || steps.meta.outputs.dependency-names == 'certifi')
          && !contains(steps.meta.outputs.dependency-names, 'bleak')
          && !contains(steps.meta.outputs.dependency-names, 'dbus-fast')
        # --match-head-commit: テスト中に Dependabot が PR を rebase した場合、
        # テストしていない新しい head をマージしないようにする (head が違えば失敗する。
        # 新しい head には新しい test 実行が走り、そちらのジョブがマージする)
        run: gh pr merge --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
