name: test

on:
  push:
    branches: [main]
  pull_request:

# リポジトリ既定も Read だが、ワークフロー単体でも最小権限を明示しておく
permissions:
  contents: read

jobs:
  # ジョブ名 "test" は main のルールセットで必須チェックに指定している (変えると自動マージが止まる)
  test:
    runs-on: ubuntu-latest
    steps:
      # actions はタグ書き換え対策でコミットハッシュ固定。Dependabot がハッシュごと更新する
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Run tests with coverage
        run: uv run pytest --cov
      - name: Coverage summary
        # カバレッジ不足 (fail_under) でテストが落ちたときこそ内訳を見たいので always。
        # --fail-under=0 は summary 出力ステップ自体が二重に失敗しないようにするため
        if: always()
        run: |
          if [ -f .coverage ]; then
            echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
            uv run coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Lint deploy scripts
        run: shellcheck deploy/bin/*.sh scripts/*.sh
