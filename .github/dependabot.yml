version: 2
updates:
  # GitHub Actions (workflows の uses: 行を監視。コミットハッシュ固定でもコメントのタグごと更新される)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Tokyo"
    # 公開から7日未満の版は PR にしない (乗っ取られた版は数日で発見・取り下げられることが多いため)。
    # 週次実行なので実際の取り込みは公開の 7〜13 日後。security update には効かず即 PR が来る
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: ["minor", "patch"]

  # Python 依存 (pyproject.toml / uv.lock を監視)。
  # マイナー/パッチは種別ごとに1つの PR にまとめ、テストが通れば自動マージされる
  # (.github/workflows/dependabot-auto-merge.yml)。メジャー更新と bleak 系は個別 PR になり、
  # 手動確認 (bleak は Pi 実機確認) してからマージする。certifi はメジャーでも自動マージ (日付バージョンのため)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Tokyo"
    # 公開から7日未満の版は PR にしない (乗っ取られた版は数日で発見・取り下げられることが多いため)。
    # 週次実行なので実際の取り込みは公開の 7〜13 日後。security update には効かず即 PR が来る
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      runtime-dependencies:
        dependency-type: "production"
        update-types: ["minor", "patch"]
        exclude-patterns: ["bleak", "dbus-fast"]
