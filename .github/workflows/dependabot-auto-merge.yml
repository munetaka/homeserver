name: dependabot auto-merge

# Dependabot の PR に「テストが通ったらマージ」(auto-merge) を予約する。
# 実際のマージ判定は main のルールセット (必須チェック = test) が行うので、
# このワークフロー自体はテスト結果を待たない。
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    # github.actor は人が再実行すると変わるため、PR の作成者で判定する
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      # 自動マージしないもの (= 手動で確認してマージ):
      #   - メジャー更新 (破壊的変更の可能性。リリースノートを読む)
      #   - bleak / dbus-fast (BLE・D-Bus の挙動は CI では検証できない。Pi 実機で確認する)
      # 例外: certifi 単独の PR はメジャーでも自動マージする。日付バージョン (2025.x→2026.x) で
      # 年が変わるたびにメジャー扱いになるが、中身は CA 証明書リスト (データ) だけで、
      # 危殆化した CA の除去など急ぎのセキュリティ更新が多いため
      - if: >-
          (steps.meta.outputs.update-type != 'version-update:semver-major'
           || steps.meta.outputs.dependency-names == 'certifi')
          && !contains(steps.meta.outputs.dependency-names, 'bleak')
          && !contains(steps.meta.outputs.dependency-names, 'dbus-fast')
        # test が先に終わって PR が既にマージ可能だと、GitHub は auto-merge の予約を
        # "Pull request is in clean/unstable status" で拒否する (test は約15秒で終わるので頻発)。
        # その場合は即マージする。直接マージでもルールセットの必須チェック test は強制される
        run: gh pr merge --auto --squash "$PR_URL" || gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
